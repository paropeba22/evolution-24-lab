name: S12 Evolution OCI artifact to private GHCR
on:
  push:
    branches:
      - ops/s12-evolution-ghcr-transfer-fix-20261022
permissions:
  actions: read
  contents: read
  packages: write
jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download the already verified build artifact
        uses: actions/download-artifact@v4
        with:
          name: evolution-writer-probe-926e5afef09f1ec62cea8bd14398275e830da34a
          path: artifact
          repository: paropeba22/evolution-24-lab
          run-id: 39709211465
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify source identity and archive checksum
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, pathlib
          root = pathlib.Path("artifact")
          meta = json.loads((root / "artifact-metadata.json").read_text())
          assert meta["source_commit"] == "926e5afef09f1ec62cea8bd14398275e830da34a"
          assert meta["platform"] == "linux/amd64"
          archive = root / "image.oci.tar"
          digest = hashlib.sha256(archive.read_bytes()).hexdigest()
          assert "sha256:" + digest == meta["archive_sha256"]
          print(json.dumps(meta, sort_keys=True))
          PY
      - name: Install OCI transport tool
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq skopeo
      - name: Authenticate to GHCR with repository token
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Copy OCI image without changing digests
        shell: bash
        run: |
          set -euo pipefail
          skopeo copy --all --preserve-digests \
            oci-archive:artifact/image.oci.tar \
            docker://ghcr.io/paropeba22/evolution-24-lab:s12-writer-probe-926e5afef09f1ec62cea8bd14398275e830da34a-verified
      - name: Verify registry manifest digest and retain transfer receipt
        shell: bash
        run: |
          set -euo pipefail
          skopeo inspect --raw docker://ghcr.io/paropeba22/evolution-24-lab:s12-writer-probe-926e5afef09f1ec62cea8bd14398275e830da34a-verified > registry-manifest.json
          python3 - <<'PY'
          import hashlib, json, pathlib, tarfile
          expected_commit = "926e5afef09f1ec62cea8bd14398275e830da34a"
          with tarfile.open("artifact/image.oci.tar", "r:*") as outer:
              index = json.load(outer.extractfile("index.json"))
              desc = next(d for d in index["manifests"]
                          if d.get("platform", {}).get("os") == "linux"
                          and d.get("platform", {}).get("architecture") == "amd64")
              manifest_bytes = outer.extractfile("blobs/sha256/" + desc["digest"].split(":", 1)[1]).read()
              expected_manifest = json.loads(manifest_bytes)
              config_digest = expected_manifest["config"]["digest"]
          remote_bytes = pathlib.Path("registry-manifest.json").read_bytes()
          remote_digest = "sha256:" + hashlib.sha256(remote_bytes).hexdigest()
          remote = json.loads(remote_bytes)
          assert remote_digest == desc["digest"], (remote_digest, desc["digest"])
          assert remote["config"]["digest"] == config_digest
          receipt = {
              "source_commit": expected_commit,
              "platform": "linux/amd64",
              "registry": "ghcr.io/paropeba22/evolution-24-lab",
              "tag": "s12-writer-probe-926e5afef09f1ec62cea8bd14398275e830da34a-verified",
              "manifest_digest": remote_digest,
              "config_digest": config_digest,
              "manifest_bytes_equal": remote_bytes == manifest_bytes
          }
          assert receipt["manifest_bytes_equal"], receipt
          pathlib.Path("transfer-receipt.json").write_text(json.dumps(receipt, indent=2) + "\n")
          print(json.dumps(receipt, sort_keys=True))
          PY
      - name: Preserve transfer receipt
        uses: actions/upload-artifact@v4
        with:
          name: evolution-writer-probe-ghcr-transfer-receipt-926e5afef09f1ec62cea8bd14398275e830da34a-verified
          path: transfer-receipt.json
          if-no-files-found: error
          retention-days: 90
