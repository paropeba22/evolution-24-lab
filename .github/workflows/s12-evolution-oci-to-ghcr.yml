name: S12 Evolution transport-return OCI to new private GHCR package
on:
  push:
    branches:
      - ops/s12-transport-return-build-20261023
permissions:
  actions: read
  contents: read
  packages: write
jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download verified build artifact
        uses: actions/download-artifact@v4
        with:
          name: evolution-writer-probe-54ba18e26c1dfb216b06059f421cdcf68ff8d206
          path: artifact
          repository: paropeba22/evolution-24-lab
          run-id: 39905293947
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify source, platform, and archive checksum
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, pathlib
          root = pathlib.Path("artifact")
          meta = json.loads((root / "artifact-metadata.json").read_text())
          assert meta["source_commit"] == "54ba18e26c1dfb216b06059f421cdcf68ff8d206"
          assert meta["platform"] == "linux/amd64"
          digest = hashlib.sha256((root / "image.oci.tar").read_bytes()).hexdigest()
          assert "sha256:" + digest == meta["archive_sha256"]
          print(json.dumps(meta, sort_keys=True))
          PY
      - name: Install OCI transport tool
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq skopeo
      - name: Authenticate to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Copy immutable OCI image
        shell: bash
        run: |
          set -euo pipefail
          skopeo copy --all --preserve-digests oci-archive:artifact/image.oci.tar docker://ghcr.io/paropeba22/nexi-evolution-s12-transport-return:54ba18e26c1dfb216b06059f421cdcf68ff8d206
      - name: Verify registry manifest and retain receipt
        shell: bash
        run: |
          set -euo pipefail
          skopeo inspect --raw docker://ghcr.io/paropeba22/nexi-evolution-s12-transport-return:54ba18e26c1dfb216b06059f421cdcf68ff8d206 > registry-index.json
          python3 - <<'PY'
          import hashlib, json, pathlib, tarfile
          with tarfile.open("artifact/image.oci.tar", "r:*") as archive:
              local_bytes = archive.extractfile("index.json").read()
              local = json.loads(local_bytes)
          remote_bytes = pathlib.Path("registry-index.json").read_bytes()
          remote = json.loads(remote_bytes)
          descs = lambda x: sorted((d["digest"], d.get("platform",{}).get("os"), d.get("platform",{}).get("architecture")) for d in x["manifests"])
          assert descs(local) == descs(remote)
          assert local_bytes == remote_bytes
          receipt = {"source_commit":"54ba18e26c1dfb216b06059f421cdcf68ff8d206","platform":"linux/amd64",
            "registry":"ghcr.io/paropeba22/nexi-evolution-s12-transport-return",
            "tag":"54ba18e26c1dfb216b06059f421cdcf68ff8d206",
            "index_sha256":"sha256:"+hashlib.sha256(remote_bytes).hexdigest(),"index_bytes_equal":True}
          pathlib.Path("transfer-receipt.json").write_text(json.dumps(receipt,indent=2)+"\n")
          print(json.dumps(receipt,sort_keys=True))
          PY
      - name: Preserve transfer receipt
        uses: actions/upload-artifact@v4
        with:
          name: evolution-transport-return-ghcr-transfer-receipt-54ba18e26c1dfb216b06059f421cdcf68ff8d206
          path: transfer-receipt.json
          if-no-files-found: error
          retention-days: 90
